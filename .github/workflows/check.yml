name: Validate Fuel Atlas
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - name: Verify generated workspace and briefing assets
        run: |
          node scripts/build-workspace.mjs --check
          python3 scripts/build_brief.py --check
      - name: Install Chromium for interface acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify real-browser navigation and responsive workflows
        run: npm run test:browser
      - name: Retain browser review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: artifacts/browser-review/
          if-no-files-found: ignore
