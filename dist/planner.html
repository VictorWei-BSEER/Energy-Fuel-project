  <script>
  (function () {
    var value = location.hash.slice(1);
    try { value = decodeURIComponent(value); } catch (_) { value = ''; }
    var parts = value.split('/');
    var tab = parts.shift();
    var aliases = { calculations: 'model', model: 'model', 'oil-markets': 'data', 'fuel-data': 'data', data: 'data', sources: 'data', research: 'research', briefing: 'method', method: 'method' };
    var target = new URL('./index.html', location.href);

    if (tab === 'sources' && !section) section = 'data-source-plan';
    target.hash = (aliases[tab] || 'model') + (section ? '/' + encodeURIComponent(section) : '');
    location.replace(target.href);
  }());
  </script>
